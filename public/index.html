<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="card">
      <header class="form-heading">
        <h1 id="form-title">Entrar</h1>
        <p id="form-description">Acesse sua conta com seu e-mail e senha.</p>
      </header>

      <div id="mode-switch" class="mode-switch" role="group" aria-label="Tipo de acesso">
        <button class="mode-button is-active" type="button" data-mode="login" aria-pressed="true">Entrar</button>
        <button class="mode-button" type="button" data-mode="register" aria-pressed="false">Criar conta</button>
      </div>

      <form id="auth-form" novalidate>
        <div id="name-field" class="field hidden">
          <label for="name">Nome</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="120" placeholder="Seu nome">
        </div>

        <div id="email-field" class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="voce@exemplo.com" required>
        </div>

        <div id="password-field" class="field">
          <div class="label-row">
            <label for="password">Senha</label>
            <button id="forgot-link" class="text-button" type="button">Esqueceu a senha?</button>
          </div>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" placeholder="Sua senha" required>
          <small id="password-hint" class="field-hint hidden">Use 10 a 128 caracteres, incluindo maiúscula, minúscula e número.</small>
        </div>

        <div id="reset-password-field" class="field hidden">
          <label for="new-password">Nova senha</label>
          <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="Nova senha">
          <small class="field-hint">Use 10 a 128 caracteres, incluindo maiúscula, minúscula e número.</small>
        </div>

        <button id="submit-button" class="submit-button" type="submit">
          <span id="submit-label">Entrar</span>
        </button>
      </form>

      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      <p id="form-footer" class="form-footer">Não tem uma conta? <button class="text-button" type="button" data-mode="register">Criar conta</button></p>
    </main>
  </body>
</html>
